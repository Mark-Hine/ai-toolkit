# Files whose `verified:` stamp the freshness job checks. Globs are relative to the repo root.
warn_days = 90
fail_days = 180
include = [
  "src/rules/**/*.md",
  "claude/home/rules/writing-style.md",
  "shared/guidance/*.md",
  "shared/guidance/references/*.md",
  "claude/plugins/*/skills/*/references/*.md",
  "claude/plugins/pr-review/skills/pr-review/references/*.md",
  "claude/plugins/pr-review/skills/pr-review/references/platforms/*.md",
  "claude/plugins/pr-review/skills/pr-review/references/languages/*.md",
]
exclude = [
  "src/rules/delegation/*.md",
  "**/*template*.md",
  "claude/plugins/toolkit/skills/audit/references/register-template.md",
]
