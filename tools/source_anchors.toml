# Source anchors: one verbatim sentence or two per standards source key, confirmed against the live
# page by tools/source_anchors.py. Format in docs/source-anchors.md.

# Anchor files the tool reads and writes.
# Skill anchor files live under src/skills, so --write edits the source. Run scripts/build/build.py afterwards.
anchors = [
  "src/skills/*/*/references/source-anchors.md",
  "shared/guidance/references/source-anchors.md",
]

# URLs that are patterns or placeholders, not pages.
skip_url_substrings = ["example.com", "localhost", "<", ">", "${", "$("]

# Hosts that render their text client-side, read through headless Chrome.
browser_hosts = ["m3.material.io", "docs.swift.org", "www.swift.org"]

max_quote_chars = 300
max_quote_sentences = 2
timeout = 30
browser_timeout = 90
browser_concurrency = 2
retries = 3
workers = 6

# When true, every key or URL a registry below declares must have an anchor, or --lint fails.
enforce = true

# Registries whose declared keys (mode "key", group 1 of the pattern is the key) or URLs (mode "url")
# need an anchor. Added as each plugin is anchored.

[[registries]]
# design-kit: every key in a sources.md table.
files = ["src/skills/design-kit/standards/references/sources.md"]
pattern = '^\| (?!Key \|)([A-Za-z][A-Za-z0-9.\-]*) \|'
mode = "key"

[[registries]]
# pr-review: every URL a platform pack or pci-dss.md defines for a [KEY].
files = ["src/skills/pr-review/pr-review/references/platforms/*.md", "src/skills/pr-review/pr-review/references/pci-dss.md"]
pattern = '^\[[A-Za-z0-9.\-]+\]: (https://\S+)'
mode = "url"

[[registries]]
# android-kit, ios-kit and web-kit: every URL the official-docs registries cite.
files = ["src/skills/android-kit/standards/references/official-docs.md", "src/skills/ios-kit/standards/references/official-docs.md", "src/skills/web-kit/standards/references/official-docs.md"]
mode = "url"

[[registries]]
# Rule files: every URL in a `sources:` list.
files = ["src/rules/**/*.md", "claude/home/rules/writing-style.md", "shared/guidance/*.md"]
mode = "sources"
