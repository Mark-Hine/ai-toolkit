# Per-target settings for scripts/build/build.py. Each [targets.<name>] table feeds the adapter of the same
# name in scripts/build/targets/. Tokens are plain text values. Capabilities drive `<!-- if: ... -->` blocks.

[targets.claude.tokens]
research_tier = "`sonnet`"
lens_launch = "Launch every lens agent with `model: opus`. In CI mode no personal instructions pin a subagent model, so the default falls back to `CLAUDE_CODE_SUBAGENT_MODEL` or the main model."
lens_launch_again = "Launch them with `model: opus` too."
research_subagent = "a research subagent pinned to `sonnet`"
design_rules_abs = "`~/.claude/rules/design-standards.md`"
design_rules_location = "are in `~/.claude/rules/design-standards.md`"
design_pointer = "the `@DESIGN.md` pointer line for the project's `CLAUDE.md`"
search = "WebSearch"
browse = "WebFetch"
preloaded = " preloaded in your context"
plan_heading = "**Plan (plan mode).**"
plan_gate = "Get approval."
uplift_gate = "Work in plan mode until step 4 is approved."
readonly_boundary = ""
fetch_title = "WebFetch"
shell = "Bash"
guard_blocks = "The guard-kit hook blocks anything else."
explore_sentence = "An Explore subagent"
home = "~/.claude/"
project_file = "CLAUDE.md"
project_file_full = "`CLAUDE.md`"
design_rules = "`~/.claude/rules/design-standards.md`"
args = "$ARGUMENTS"
explore = "an Explore subagent"
fetch = "WebFetch"
project_template = "project-claude-md-template.md"
local_notes = "`CLAUDE.local.md`"

# Tokens with an argument such as {@rule web/testing}. {platform} and {name} are the two halves of the argument.
[targets.claude.formats]
delegate = "`{arg}`"
own_script = "`${{CLAUDE_SKILL_DIR}}/scripts/{arg}`"
rule_clause = "the {title} {name} rule (`~/.claude/rules/{platform}/{name}.md`, or `references/{name}.md` in `{platform}-kit:standards` when the rule is not installed)"
skill_named = "`{id}`"
rule = "`~/.claude/rules/{platform}/{name}.md`"
rules_dir = "`~/.claude/rules/{platform}/`"
rules_in_scope = "every rule in `~/.claude/rules/` and the project's `.claude/rules/` whose `paths`"

[targets.claude.capabilities]
bundled_rules = false
skills_preload = true
plan_mode = true
reviewer_runs_builds = true
skill_allowlist = true
auto_loads_rules = true
invoke_subagent = false
ci_cli = "claude"

[targets.claude.models]
research = "sonnet"
review = "opus"

[targets.claude.file_names]
"project-template.md" = "project-claude-md-template.md"

# Claude frontmatter for each agent role, in output order. `skills = true` preloads the agent's skills there.
[targets.claude.roles.researcher]
tools = "Read, Grep, Glob, Bash, WebFetch, WebSearch"
disallowedTools = "Edit, Write, NotebookEdit"
model = "{@model research}"
effort = "medium"
maxTurns = 15
skills = true
color = "blue"

[targets.claude.roles.reviewer]
tools = "Read, Grep, Glob, Bash"
disallowedTools = "Edit, Write, NotebookEdit"
model = "{@model review}"
effort = "high"
maxTurns = 20
skills = false
color = "red"

[targets.claude.agents.android-verifier]
maxTurns = 35

[targets.claude.agents.ui-reviewer]
color = "purple"

[targets.claude.roles.verifier]
tools = "Read, Grep, Glob, Bash"
disallowedTools = "Edit, Write, NotebookEdit"
model = "{@model research}"
effort = "medium"
maxTurns = 25
skills = true
color = "green"

[targets.codex.tokens]
research_tier = "research-tier (`gpt-6-sol`)"
lens_launch = "Run every lens agent on the reviewer-tier model (`gpt-6-astra` at high reasoning effort), as the toolkit's reviewer agents do. In CI mode no personal instructions choose it."
lens_launch_again = "Run them on the reviewer-tier model too."
research_subagent = "a read-only research subagent"
design_rules_abs = "`~/.codex/guidance/design-standards.md`"
design_rules_location = "are in `~/.codex/guidance/design-standards.md`"
design_pointer = "the pointer line for the project's `AGENTS.md` from `design-contract.md`"
search = "web search"
browse = "web browsing"
preloaded = ""
plan_heading = "**Plan.**"
plan_gate = "Proceed within the user-authorized scope. Ask only about unresolved scope or consequential choices."
uplift_gate = "Write the step 4 plan before editing dependency versions. Existing authorization to perform the uplift is sufficient."
readonly_boundary = "The read-only sandbox is intentional."
fetch_title = "Web fetch"
shell = "shell tools"
guard_blocks = "Anything else is blocked."
explore_sentence = "An explorer subagent"
reviewer_no_writes = "The read-only sandbox is intentional. Do not run installs or builds, or escalate for writes."
home = "~/.codex/"
project_file = "AGENTS.md"
project_file_full = "`AGENTS.md`"
design_rules = "`guidance/design-standards.md`"
args = "the user request"
explore = "an explorer subagent"
fetch = "web fetch"
project_template = "project-agents-md-template.md"
local_notes = "`.local/agent-notes.md`"

[targets.codex.formats]
delegate = "the `{arg}` agent"
own_script = "`{arg}` in the `scripts/` folder beside this skill"
rule_clause = "the {title} {name} guidance (`~/.codex/guidance/{platform}/{name}.md`, or `references/{name}.md` in the `{platform}-standards` skill when the guidance is not installed)"
skill_named = "the `{id}` skill"
agent_footer = "Read ~/.codex/machine.md and applicable ~/.codex/guidance/{platform} files. Read project AGENTS.md, falling back to CLAUDE.md if absent. Discover optional tools first. Do not claim unavailable checks ran. Use tool execution and polling controls rather than a shell timeout wrapper."
rule = "`~/.codex/guidance/{platform}/{name}.md`"
rules_dir = "`~/.codex/guidance/{platform}/`"
rules_in_scope = "every rule in `~/.codex/guidance/` and the project's `.codex/guidance/` (or `.claude/rules/` during migration) whose `paths`"

[targets.codex.capabilities]
bundled_rules = false
skills_preload = false
plan_mode = false
reviewer_runs_builds = false
skill_allowlist = false
auto_loads_rules = false
invoke_subagent = false
ci_cli = "codex"

[targets.codex.models]
research = "gpt-6-sol"
review = "gpt-6-astra"

[targets.codex.file_names]
"project-template.md" = "project-agents-md-template.md"

[targets.codex.preambles]
review = "Read the project AGENTS.md and applicable global guidance first. If AGENTS.md is absent, read CLAUDE.md as migration fallback. Discover optional skills before invoking them. If `using-chrisbanes-skills`, `android-cli`, or an official Android skill is unavailable, use the bundled android-standards references and current official documentation. Do not invent commands or claim that an absent skill ran. Use installed Android SDK tools when the optional Android CLI is missing. Commit and push only when the user has requested that action."
playbook = "Read the project AGENTS.md and applicable global guidance first. Fall back to CLAUDE.md if AGENTS.md is absent. Follow the global rules for optional tools, specialist agents and Git actions."

[targets.codex.roles.researcher]
model = "{@model research}"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

[targets.codex.roles.reviewer]
model = "{@model review}"
model_reasoning_effort = "high"
sandbox_mode = "read-only"

[targets.codex.roles.verifier]
model = "{@model research}"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

[targets.antigravity.tokens]
research_tier = "research-tier (`flash`)"
lens_launch = "Run every lens agent on the reviewer-tier model (`pro`), as the toolkit's reviewer agents do. In CI mode no personal instructions choose it."
lens_launch_again = "Run them on the reviewer-tier model too."
research_subagent = "a research subagent with `model: flash`"
design_rules_abs = "the design-kit rules (`~/.gemini/config/guidance/design-standards.md`)"
design_rules_location = "load with the design-kit plugin"
design_pointer = "the pointer line for the project's `AGENTS.md` from `design-contract.md`"
search = "web search"
browse = "web browsing"
preloaded = ""
plan_heading = "**Plan.**"
plan_gate = "Proceed within the user-authorized scope. Ask only about unresolved scope or consequential choices."
uplift_gate = "Write the step 4 plan before editing dependency versions. Existing authorization to perform the uplift is sufficient."
readonly_boundary = "The read-only boundary is intentional."
fetch_title = "Web fetch"
shell = "shell tools"
guard_blocks = "Anything else is blocked."
explore_sentence = "A research subagent"
reviewer_no_writes = "Your tool list has no write tools by design. Do not run installs or builds."
home = "~/.gemini/config/"
project_file = "AGENTS.md"
project_file_full = "`AGENTS.md` (or `GEMINI.md`)"
design_rules = "the design-kit rules (`~/.gemini/config/guidance/design-standards.md`)"
args = "the user request"
explore = "a research subagent"
fetch = "web fetch"
project_template = "project-agents-md-template.md"
local_notes = "`.local/agent-notes.md`"

[targets.antigravity.formats]
delegate = "`{arg}` through `invoke_subagent`"
own_script = "`{arg}` in the `scripts/` folder beside this skill"
rule_clause = "the {platform}-kit {name} rule"
skill_named = "the `{id}` skill"
agent_footer = "Read `~/.gemini/config/machine.md` and the {platform}-kit rules, which load with this plugin. Read project `AGENTS.md`, falling back to `CLAUDE.md` if absent. Discover optional tools first. Do not claim unavailable checks ran."
rule = "the {platform}-kit {name} rule"
rules_dir = "the {platform}-kit rules"
rules_in_scope = "the {platform}-kit rules (loaded with this plugin) and the project's rules whose paths"

[targets.antigravity.capabilities]
bundled_rules = true
skills_preload = false
plan_mode = false
reviewer_runs_builds = false
skill_allowlist = false
auto_loads_rules = false
invoke_subagent = true
ci_cli = "agy"

[targets.antigravity.models]
research = "flash"
review = "pro"

[targets.antigravity.file_names]
"project-template.md" = "project-agents-md-template.md"

[targets.antigravity.preambles]
review = "Read the project AGENTS.md (or GEMINI.md) and applicable guidance first. If AGENTS.md is absent, read CLAUDE.md as migration fallback. Discover optional skills before invoking them. If `using-chrisbanes-skills`, `android-cli`, or an official Android skill is unavailable, use bundled android-standards references and current official documentation. Do not invent commands or claim that an absent skill ran. Use installed Android SDK tools when optional Android CLI is missing. Commit and push only when the user has requested that action."
playbook = "Read the project AGENTS.md (or GEMINI.md) and applicable guidance first. Fall back to CLAUDE.md if AGENTS.md is absent. Follow global rules for optional tools, specialist subagents and Git actions."

[targets.antigravity.roles.researcher]
model = "{@model research}"
tools = ["view_file", "list_dir", "find_by_name", "grep_search", "search_web", "read_url_content", "run_command"]
subagent = true
mainAgent = false
commandExecutionPolicy = "off"
skills = true

[targets.antigravity.roles.reviewer]
model = "{@model review}"
tools = ["view_file", "list_dir", "find_by_name", "grep_search", "run_command"]
subagent = true
mainAgent = false
commandExecutionPolicy = "off"
skills = true

[targets.antigravity.roles.verifier]
model = "{@model research}"
tools = ["view_file", "list_dir", "find_by_name", "grep_search", "run_command"]
subagent = true
mainAgent = false
commandExecutionPolicy = "auto"
skills = true

# Sources that name every agent on purpose, exempt from the literal-wording lint. A `path:text` entry exempts
# only the lines that contain the text.
[lint]
allow = [
  "src/skills/design-kit/standards/references/design-contract.md",
  "src/skills/toolkit/audit/references/sources.md",
  "src/skills/pr-review/pr-review/references/platforms/",
  "src/skills/toolkit/check/SKILL.md:AGENTS.md",
]

# Antigravity loads one always-on rules file per plugin. Order of sources is the order of sections.
[targets.antigravity.agents.ui-reviewer]
tools = ["view_file", "list_dir", "find_by_name", "grep_search", "read_url_content", "run_command"]

[[targets.antigravity.rule_files]]
kit = "android-kit"
title = "Android and Kotlin rules"
sources = ["src/rules/android/kotlin-style.md", "src/rules/android/compose.md",
           "src/rules/android/ui-events.md", "src/rules/android/testing.md"]

[[targets.antigravity.rule_files]]
kit = "ios-kit"
title = "iOS and Swift rules"
sources = ["src/rules/ios/swift-style.md", "src/rules/ios/swiftui.md",
           "src/rules/ios/ui-events.md", "src/rules/ios/testing.md"]

[[targets.antigravity.rule_files]]
kit = "web-kit"
title = "Web, React and TypeScript rules"
sources = ["src/rules/web/typescript.md", "src/rules/web/react.md", "src/rules/web/testing.md"]

[[targets.antigravity.rule_files]]
kit = "design-kit"
title = "Design rules"
sources = ["shared/guidance/design-standards.md"]

# Files copied byte for byte, with their mode, from one canonical path to each target's copies.
[[copies]]
src = "shared/hooks/guard.py"
claude = ["claude/plugins/guard-kit/hooks/guard.py"]
codex = ["codex/hooks/guard.py"]
antigravity = ["antigravity/plugins/android-kit/hooks/guard.py", "antigravity/plugins/ios-kit/hooks/guard.py",
               "antigravity/plugins/web-kit/hooks/guard.py"]

[[copies]]
src = "shared/hooks/swift_lint.py"
claude = ["claude/plugins/ios-kit/hooks/swift_lint.py"]
codex = ["codex/hooks/swift_lint.py"]
antigravity = ["antigravity/plugins/ios-kit/hooks/swift_lint.py"]

[[copies]]
src = "shared/guidance/references/kotlin-rationale.md"
claude = ["claude/plugins/pr-review/skills/pr-review/references/languages/kotlin.md"]
codex = ["codex/skills/pr-review/references/languages/kotlin.md"]
antigravity = ["antigravity/plugins/pr-review/skills/pr-review/references/languages/kotlin.md"]
