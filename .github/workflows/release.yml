name: release
# Tags and releases each Claude plugin whose version on main has no release yet (tools/release_tags.py).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tag and release changed plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_tags.py --target "$GITHUB_SHA"
