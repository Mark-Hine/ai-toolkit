name: ci
on: [push, pull_request]
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Private terms denylist
        run: bash scripts/check-private-terms.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugins
        run: |
          claude plugin validate claude/plugins/android-kit
          claude plugin validate claude/plugins/pr-review
          claude plugin validate claude/plugins/ios-kit
      - name: Hook regression checks
        run: bash claude/plugins/android-kit/hooks/test-guards.sh
  validate-codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Codex assets
        run: python3 codex/scripts/validate.py
      - name: Test guards and installer
        run: python3 -m unittest discover -s codex/tests -v
      - name: Installer shell syntax
        run: bash -n codex/install.sh
