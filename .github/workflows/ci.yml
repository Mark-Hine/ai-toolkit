name: ci
on: [push, pull_request]
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugins
        run: |
          claude plugin validate claude/plugins/android-kit
          claude plugin validate claude/plugins/pr-review
      - name: Hook scripts parse
        run: bash -n claude/plugins/android-kit/hooks/guard-bash.sh && bash -n claude/plugins/android-kit/hooks/guard-edit.sh
