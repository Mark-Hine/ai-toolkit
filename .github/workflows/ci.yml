name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  validate-plugins:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: '2.1.284'
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace and plugins (strict)
        run: |
          claude plugin validate . --strict
          for p in claude/plugins/*/; do claude plugin validate "$p" --strict; done
      - name: Hook regression checks
        run: bash claude/tests/test-guards.sh
      - name: Shell syntax
        run: git ls-files 'claude/*.sh' 'claude/**/*.sh' | xargs -n1 bash -n
  validate-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repo structure
        run: python3 scripts/ci/check_repo.py
      - name: Mirror parity
        run: python3 scripts/ci/check_parity.py
      - name: Writing style
        run: python3 scripts/ci/check_style.py
      - name: Shared tests
        run: python3 -m unittest discover -s shared/tests -v
      - name: Plugin versions bumped
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/check_plugin_versions.py --base "origin/${GITHUB_BASE_REF}"
  validate-codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Codex assets
        run: python3 codex/scripts/validate.py
      - name: Test guards, installer and validator
        run: python3 -m unittest discover -s codex/tests -v
      - name: Installer shell syntax
        run: bash -n codex/install.sh
  validate-antigravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Antigravity assets
        run: python3 antigravity/scripts/validate.py
      - name: Test guards and installer
        run: python3 -m unittest discover -s antigravity/tests -v
      - name: Installer shell syntax
        run: bash -n antigravity/install.sh
